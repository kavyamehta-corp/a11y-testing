<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Button Labels</title>
</head>

<body>
    <h1>No-span Radio button test example</h1>
    <div class="radio-group">
    	<input type="radio" id="cow" name="animal" value="cow">
    	<label for="cow">Cow</label>
    </div>

    <h1>Radio button test example</h1>
    <div class="radio-group">
        <input type="radio" id="carrot" name="veggie" value="carrot">
        <label for="carrot"><span>Carrot</span></label>
    </div>


</body></html>
