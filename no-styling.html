<!DOCTYPE html>
<!-- saved from url=(0030)https://khsruru.com/radio.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Styling Radio Button Labels</title>
</head>

<body>
    <h1> No-Styling example </h1>
    <br>
    <h1>Good Case: No Span</h1>
    <div class="radio-group">
    	<input type="radio" id="cow" name="animal" value="cow">
    	<label for="cow">Cow</label>
    </div>

    <h1>Bad Case: With Span</h1>
    <div class="radio-group">
        <input type="radio" id="carrot" name="veggie" value="carrot">
        <label for="carrot"><span>Carrot</span></label>
    </div>


</body></html>
